name: Parser tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Check inline map JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>\s*(.*?)\s*</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline map script, found {len(scripts)}")
          Path("/tmp/map-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/map-inline.js
