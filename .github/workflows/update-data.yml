
name: Update airspace data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Avoid the top of the hour, when GitHub Actions scheduling is busiest.
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-airspace-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and publish Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@PlanKoverTDay"
          TELEGRAM_LONG_POLL_TIMEOUT_SECONDS: ${{ github.event_name == 'schedule' && '25' || '0' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          poll_once() {
            python scripts/collector.py
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "Update Telegram airspace data"
              # A concurrent manual edit or another workflow may advance main
              # between checkout and push. Rebase this data commit and retry.
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then
                  return 0
                fi
                echo "Push attempt $attempt failed; rebasing onto latest main."
                git fetch origin main
                git rebase origin/main
              done
              echo "Could not publish after three attempts." >&2
              return 1
            fi
          }

          # Perform one poll per workflow run. Scheduled polling may wait up to
          # 25 seconds in Telegram, then exits well before the next five-minute
          # slot instead of holding the concurrency group for almost four minutes.
          poll_once
