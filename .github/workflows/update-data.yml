
name: Update airspace data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Avoid the top of the hour, when GitHub Actions scheduling is busiest.
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-airspace-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and publish Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@PlanKoverTDay"
          TELEGRAM_LONG_POLL_TIMEOUT_SECONDS: ${{ github.event_name == 'schedule' && '25' || '0' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          poll_once() {
            for attempt in 1 2 3; do
              python scripts/collector.py
              git add data/
              if git diff --cached --quiet; then
                return 0
              fi
              git commit -m "Update Telegram airspace data"
              if git push origin HEAD:main; then
                return 0
              fi

              # If main advanced concurrently, discard this local attempt and
              # rerun the collector from the latest committed state. Telegram
              # updates are acknowledged only after the next offset is sent,
              # so uncommitted updates can be fetched again.
              echo "Push attempt $attempt failed; retrying from latest main."
              git fetch origin main
              git reset --hard origin/main
            done
            echo "Could not publish after three attempts." >&2
            return 1
          }

          # Perform one poll per workflow run. Scheduled polling may wait up to
          # 25 seconds in Telegram, then exits well before the next five-minute
          # slot instead of holding the concurrency group for almost four minutes.
          poll_once
